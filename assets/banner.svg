<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Keenetic SMB UI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#101a28"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ea1ff"/>
      <stop offset="100%" stop-color="#7b5cff"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ea1ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7b5cff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <circle cx="1120" cy="40" r="220" fill="url(#glow)"/>
  <circle cx="140" cy="300" r="180" fill="url(#glow)" opacity="0.5"/>

  <!-- logo mark -->
  <g transform="translate(96 96)">
    <rect width="128" height="128" rx="30" fill="url(#accent)"/>
    <rect x="30" y="30" width="34" height="68" rx="12" fill="#06121f"/>
    <rect x="72" y="46" width="26" height="52" rx="10" fill="#06121f" opacity="0.75"/>
  </g>

  <text x="256" y="150" fill="#eef4ff" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-0.5">Keenetic SMB UI</text>
  <text x="258" y="196" fill="#93a7c4" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="26">Own SMB server with a web panel for Keenetic / Entware</text>

  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#cfe0ff">
    <rect x="258" y="226" width="196" height="38" rx="19" fill="#16233a" stroke="#26405f"/>
    <text x="278" y="251">private SMB on its own IP</text>
    <rect x="468" y="226" width="196" height="38" rx="19" fill="#16233a" stroke="#26405f"/>
    <text x="488" y="251">aggregated Proxmox disks</text>
    <rect x="678" y="226" width="150" height="38" rx="19" fill="#16233a" stroke="#26405f"/>
    <text x="698" y="251">single Go binary</text>
    <rect x="842" y="226" width="180" height="38" rx="19" fill="#16233a" stroke="#26405f"/>
    <text x="862" y="251">opkg install &amp; update</text>
  </g>
</svg>
