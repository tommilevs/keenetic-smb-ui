<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Keenetic SMB UI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#101a28"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ea1ff"/>
      <stop offset="100%" stop-color="#7b5cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#4ea1ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#4ea1ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7b5cff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7b5cff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame">
      <rect width="1280" height="300" rx="24"/>
    </clipPath>
  </defs>

  <rect width="1280" height="300" rx="24" fill="url(#bg)"/>
  <g clip-path="url(#frame)">
    <circle cx="1150" cy="50" r="240" fill="url(#glow)"/>
    <circle cx="90" cy="290" r="200" fill="url(#glow2)"/>
  </g>

  <g transform="translate(96 84)">
    <rect width="132" height="132" rx="32" fill="url(#accent)"/>
    <rect x="31" y="31" width="35" height="70" rx="13" fill="#06121f"/>
    <rect x="74" y="48" width="27" height="53" rx="11" fill="#06121f" opacity="0.75"/>
  </g>

  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <text x="264" y="146" fill="#eef4ff" font-size="56" font-weight="700" letter-spacing="-0.5">Keenetic SMB UI</text>
    <text x="266" y="192" fill="#93a7c4" font-size="25">Own SMB server with a web panel for Keenetic / Entware</text>
    <text x="266" y="240" fill="#9db6dc" font-size="18">private SMB on its own IP   ·   aggregated Proxmox disks   ·   single Go binary   ·   opkg install &amp; update</text>
  </g>
</svg>
